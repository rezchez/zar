name: zar

services:
  pocketbase:
    build:
      context: ./backend
    platform: linux/amd64
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: "on-failure:5"
    init: true
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./backend/pb_data
        target: /pb/pb_data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    network_mode: service:pocketbase
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: "on-failure:5"
    init: true
    env_file:
      - path: ./frontend/.env
        format: raw
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      POCKETBASE_URL: http://127.0.0.1:8090
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_DIST_DIR: .next
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./frontend/app_backups
        target: /app/app_backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
