<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian High-Contrast Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="55%" stop-color="#14151c" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>

    <!-- Radiant Polished Gold Gradient for Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="25%" stop-color="#F7D070" />
      <stop offset="60%" stop-color="#D9A132" />
      <stop offset="85%" stop-color="#AF7512" />
      <stop offset="100%" stop-color="#E9BF57" />
    </linearGradient>

    <!-- High-Contrast Luminous Gold Gradient for Rods -->
    <linearGradient id="goldRod" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6" />
      <stop offset="25%" stop-color="#F5CB65" />
      <stop offset="65%" stop-color="#D49B25" />
      <stop offset="100%" stop-color="#A56E0E" />
    </linearGradient>

    <!-- 3D Specular Highlight for Nodes -->
    <radialGradient id="goldNode" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#F8D374" />
      <stop offset="70%" stop-color="#D79E2A" />
      <stop offset="100%" stop-color="#9E680A" />
    </radialGradient>

    <!-- Drop Shadow for High-Contrast 3D Pop -->
    <filter id="highContrastShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="7" y="7" width="498" height="498" rx="108"
        fill="url(#bgGrad)"
        stroke="url(#goldBorder)"
        stroke-width="11"
        stroke-linejoin="round"
        filter="url(#borderGlow)" />

  <!-- Constellation and Diamond Group with 3D Depth Shadow -->
  <g filter="url(#highContrastShadow)">
    <!-- 1. Diamond Top Emblem -->
    <!-- Diamond Facet Lines -->
    <g stroke="url(#goldRod)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Table top line -->
      <line x1="240" y1="87" x2="296" y2="87" />
      <!-- Girdle horizontal line -->
      <line x1="228" y1="104" x2="308" y2="104" />
      <!-- Upper facets -->
      <line x1="240" y1="87" x2="228" y2="104" />
      <line x1="240" y1="87" x2="254" y2="104" />
      <line x1="268" y1="87" x2="254" y2="104" />
      <line x1="268" y1="87" x2="282" y2="104" />
      <line x1="296" y1="87" x2="282" y2="104" />
      <line x1="296" y1="87" x2="308" y2="104" />
      <!-- Lower facets meeting at culet -->
      <line x1="228" y1="104" x2="268" y2="143" />
      <line x1="254" y1="104" x2="268" y2="143" />
      <line x1="282" y1="104" x2="268" y2="143" />
      <line x1="308" y1="104" x2="268" y2="143" />
    </g>

    <!-- Diamond Vertex Nodes -->
    <g fill="url(#goldNode)">
      <!-- Table nodes -->
      <circle cx="240" cy="87" r="3.5" />
      <circle cx="268" cy="87" r="3.5" />
      <circle cx="296" cy="87" r="3.5" />
      <!-- Girdle nodes -->
      <circle cx="228" cy="104" r="3.5" />
      <circle cx="254" cy="104" r="3.5" />
      <circle cx="282" cy="104" r="3.5" />
      <circle cx="308" cy="104" r="3.5" />
      <!-- Culet node -->
      <circle cx="268" cy="143" r="4.2" />
    </g>

    <!-- 2. Main Constellation Network (Zar Stylized Network) -->
    <!-- Connecting Rods -->
    <g stroke="url(#goldRod)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="298" y1="180" x2="250" y2="216" />
      <line x1="298" y1="180" x2="328" y2="294" />
      <line x1="250" y1="216" x2="328" y2="294" />
      <line x1="250" y1="216" x2="280" y2="331" />
      <line x1="328" y1="294" x2="280" y2="331" />
      <line x1="328" y1="294" x2="307" y2="390" />
      <line x1="280" y1="331" x2="181" y2="394" />
      <line x1="280" y1="331" x2="307" y2="390" />
      <line x1="280" y1="331" x2="248" y2="425" />
      <line x1="181" y1="394" x2="248" y2="425" />
      <line x1="248" y1="425" x2="307" y2="390" />
    </g>

    <!-- Constellation Spherical Nodes -->
    <g fill="url(#goldNode)" stroke="#6B4605" stroke-width="1.2">
      <circle cx="298" cy="180" r="15.5" />
      <circle cx="250" cy="216" r="16.5" />
      <circle cx="328" cy="294" r="16.5" />
      <circle cx="280" cy="331" r="16.5" />
      <circle cx="181" cy="394" r="15.5" />
      <circle cx="307" cy="390" r="15.0" />
      <circle cx="248" cy="425" r="14.5" />
    </g>
  </g>
</svg>