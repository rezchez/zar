# Shared proxy maps for multi-site Nginx reverse proxy setups.
# Placed in /etc/nginx/conf.d/ so multiple sites in sites-available/ can reuse them
# without duplicate map declarations.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve X-Forwarded-Proto from trusted upstream CDN (e.g. ArvanCloud) when origin runs on HTTP,
# falling back to Nginx $scheme if the header is absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
