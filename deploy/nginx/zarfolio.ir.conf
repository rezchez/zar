server {
    listen 80;
    listen [::]:80;

    server_name zarfolio.ir www.zarfolio.ir;

    # Allow larger uploads (images, backup restores, etc.)
    client_max_body_size 50m;

    # Proxy only GET/HEAD requests for uploaded files directly to PocketBase.
    # PocketBase admin UI (/_/) and collection APIs remain private on 127.0.0.1:8090.
    location ~ ^/api/files/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy all application pages and Next.js API routes to the Next.js server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
